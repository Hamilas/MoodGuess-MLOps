
# MoodGuess-MLOps — Local Development Stack
# Ports: 5080 (API), 5081 (MLflow), 5082 (Prometheus), 5083 (Grafana), 5084 (Redis Commander)
# Usage: docker-compose up --build

services:
  sentiment-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5080:8000"
    environment:
      - MLOPS_DEBUG=true
      - MLOPS_LOG_LEVEL=DEBUG
      - MLOPS_PROFILE=local
      - MLOPS_MODEL_BACKEND=mock
      - MLOPS_REDIS_ENABLED=true
      - MLOPS_REDIS_HOST=redis
      - MLOPS_REDIS_PORT=6379
      - MLOPS_KAFKA_ENABLED=false
      - MLOPS_VAULT_ENABLED=false
      - MLOPS_TRACING_ENABLED=false
      - MLOPS_API_KEY=MoodGuessDemo2024
      - MLOPS_ALLOWED_ORIGINS=["http://localhost:5080","http://localhost:5173","http://localhost:3000","http://localhost:8000"]
      - MLOPS_MLFLOW_ENABLED=true
      - MLOPS_MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./app:/app/app:ro
    depends_on:
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - moodguess

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - moodguess

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    ports:
      - "5081:5000"
    command: >
      mlflow server
        --backend-store-uri sqlite:///mlflow.db
        --default-artifact-root /mlflow/artifacts
        --host 0.0.0.0
        --port 5000
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - moodguess

  prometheus:
    image: prom/prometheus:v2.49.0
    ports:
      - "5082:9090"
    volumes:
      - ./config/monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=7d'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - moodguess

  grafana:
    image: grafana/grafana:10.3.0
    ports:
      - "5083:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=moodguess
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/monitoring/grafana:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - moodguess

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5080
      - VITE_API_KEY=MoodGuessDemo2024
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/index.html:/app/index.html:ro
    depends_on:
      - sentiment-api
    restart: unless-stopped
    networks:
      - moodguess

volumes:
  mlflow-data:
  prometheus-data:
  grafana-data:

networks:
  moodguess:
    driver: bridge
