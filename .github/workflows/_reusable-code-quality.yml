name: Reusable Code Quality

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        required: false
        type: string
        default: "3.11"
      target-paths:
        description: "Paths to check (space-separated)"
        required: false
        type: string
        default: "app/ tests/ scripts/ run.py"

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip "setuptools<82" wheel
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Black
        env:
          TARGET_PATHS: ${{ inputs.target-paths }}
        run: black --check $TARGET_PATHS

      - name: Run isort
        env:
          TARGET_PATHS: ${{ inputs.target-paths }}
        run: isort --check-only $TARGET_PATHS

      - name: Run Ruff
        env:
          TARGET_PATHS: ${{ inputs.target-paths }}
        run: ruff check $TARGET_PATHS

      - name: Run Flake8
        env:
          TARGET_PATHS: ${{ inputs.target-paths }}
        run: flake8 $TARGET_PATHS

      - name: Run mypy
        run: mypy app/ --ignore-missing-imports --allow-untyped-decorators

      - name: Check complexity with Radon
        run: radon cc app/ --min B --show-complexity

      - name: Run Bandit security scan
        run: bandit -r app/ -c pyproject.toml
